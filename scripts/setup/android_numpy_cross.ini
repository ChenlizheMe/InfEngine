[constants]
python_runtime = @INFERNUX_ANDROID_PYTHON_LIBRARY@

[properties]
# Android arm64-v8a and x86_64 both use little-endian IEEE binary128 for
# C long double. Cross builds cannot execute NumPy's representation probe.
longdouble_format = 'IEEE_QUAD_LE'

[built-in options]
# Use the ABI-specific target library during both Meson feature probes and
# extension linking. Feature probes do not inherit Python dependency -L flags.
c_link_args = [python_runtime]
cpp_link_args = [python_runtime]
