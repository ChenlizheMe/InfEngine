[properties]
# Android arm64-v8a and x86_64 both use little-endian IEEE binary128 for
# C long double. Cross builds cannot execute NumPy's representation probe.
longdouble_format = 'IEEE_QUAD_LE'

[built-in options]
# Android extension modules link libpython explicitly. cibuildwheel supplies
# the target prefix's library search path; never borrow a host Python library.
c_link_args = ['-lpython3.13']
cpp_link_args = ['-lpython3.13']
