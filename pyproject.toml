[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "Infernux"
version = "0.2.9"
description = "Infernux (熔炉) — open-source game engine with a C++17 / Vulkan runtime and a Python layer for gameplay, tools, and render authoring."
authors = [{name = "Lizhe Chen", email = "chenlizheme@outlook.com"}]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["game-engine", "vulkan", "python", "rendergraph", "editor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "numpy>=1.21.0",
    "numba>=0.61.0",
    "watchdog>=1.0.0",
    "Pillow>=10.4.0",
    "imageio>=2.34.0",
    "av>=12.0.0",
    "mcp>=1.24,<2",
    "fastmcp",
]

[project.urls]
Homepage = "https://infernux-engine.com/"
Documentation = "https://infernux-engine.com/wiki.html"
Repository = "https://github.com/ChenlizheMe/Infernux"
Issues = "https://github.com/ChenlizheMe/Infernux/issues"

[project.optional-dependencies]
launcher = ["PySide6>=6.5.0"]

[project.scripts]
infernux-mcp = "Infernux.mcp.client:main"

[tool.setuptools]
packages = {find = {where = ["python"], exclude = ["test", "test.*", "*.test", "*.test.*", "*.tests", "*.tests.*", "*.__pycache__", "*.__pycache__.*"]}}
package-dir = {"" = "python"}
include-package-data = true

[tool.setuptools.package-data]
Infernux = [
    "py.typed",
    "*.pyi",
    "**/*.pyi",
    "*.dll",
    "*.pyd",
    "*.so",
    "*.dylib",
    "**/_InfernuxBootstrap*.pyd",
    "**/_InfernuxBootstrap*.so",
    "**/_InfernuxBootstrap*.dylib",
    "_runtime_packs/*/Player.inxmanifest",
    "_runtime_packs/*/Runtime.inxrt",
    "_runtime_modules/*/Player.inxmanifest",
    "_runtime_modules/*/Parallel.inxmod",
    "resources/player/*.exe",
    "resources/icons/*.png",
    "resources/icons/*.ico",
    "resources/icons/components/*.png",
    "resources/fonts/*.otf",
    "resources/fonts/*.ttf",
    "resources/fonts/*.txt",
    "resources/pictures/*.png",
    "resources/schemas/*.json",
    "resources/supports/*.txt",
]

[tool.setuptools.exclude-package-data]
Infernux = [
    "**/*.meta",
    "**/*.bak",
    "**/*.pdb",
    "**/*.lib",
    "**/*.exp",
    "_runtime_packs/**/*.zip",
    "_runtime_packs/**/*.inxpack",
    "_runtime_packs/**/runtime-pack.json",
    "_runtime_packs/**/*.tmp/*",
    "_runtime_modules/**/*.zip",
    "_runtime_modules/**/*.inxpack",
    "_runtime_modules/**/parallel-module.json",
    "_runtime_modules/**/*.tmp/*",
]
