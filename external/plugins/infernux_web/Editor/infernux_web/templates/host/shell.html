<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#07111d">
  <link rel="icon" href="data:,">
  <title>Infernux Player</title>
  <style>
    :root { color-scheme: dark; background: #111214; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #111214;
      font: 14px/1.4 system-ui, sans-serif;
      color: #d8e6ef;
      touch-action: none;
    }
    #infernux-shell { position: fixed; inset: 0; }
    #canvas { width: 100%; height: 100%; display: block; outline: 0; }
    #infernux-safe-area-probe {
      position: fixed;
      inset: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      visibility: hidden;
      pointer-events: none;
    }
    #infernux-text-input {
      position: fixed;
      left: -10000px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    #infernux-loader {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      background: radial-gradient(circle at 50% 43%, #242528 0%, #161719 42%, #0d0e0f 100%);
      pointer-events: none;
      transition: opacity 180ms ease;
    }
    #infernux-loader.ready { background: rgba(13, 14, 15, .78); }
    #infernux-loader.hidden { opacity: 0; }
    #infernux-loader-card { width: min(360px, 76vw); text-align: center; }
    #infernux-loader-logo {
      width: clamp(96px, 18vw, 148px);
      height: auto;
      filter: drop-shadow(0 18px 28px rgba(0, 0, 0, .42));
    }
    #status { margin-top: 22px; min-height: 20px; color: #e8e8e8; }
    #infernux-progress-track {
      height: 3px;
      margin-top: 12px;
      overflow: hidden;
      background: #343538;
    }
    #infernux-progress {
      width: 0;
      height: 100%;
      background: #ed3b2f;
      transition: width 120ms ease;
    }
    #infernux-loader.indeterminate #infernux-progress {
      width: 34%;
      animation: infernux-progress 1.15s ease-in-out infinite;
    }
    #infernux-loader-hint { margin-top: 10px; color: #96989d; font-size: 12px; }
    @keyframes infernux-progress {
      from { transform: translateX(-115%); }
      to { transform: translateX(295%); }
    }
  </style>
</head>
<body>
  <main id="infernux-shell">
    <canvas id="canvas" tabindex="0" autofocus aria-label="Infernux game canvas"></canvas>
    <div id="infernux-safe-area-probe" aria-hidden="true"></div>
    <input id="infernux-text-input" type="text" aria-label="Game text input" autocomplete="off" autocapitalize="off" spellcheck="false">
    <section id="infernux-loader" class="indeterminate" aria-live="polite">
      <div id="infernux-loader-card">
        <img id="infernux-loader-logo" src="infernux-logo.png" alt="Infernux">
        <div id="status" role="status">Preparing Infernux Player</div>
        <div id="infernux-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="infernux-progress"></div>
        </div>
        <div id="infernux-loader-hint">Loading game content…</div>
      </div>
    </section>
  </main>
  <script>
    const statusNode = document.getElementById('status');
    const loaderNode = document.getElementById('infernux-loader');
    const loaderHintNode = document.getElementById('infernux-loader-hint');
    const progressTrackNode = document.getElementById('infernux-progress-track');
    const progressNode = document.getElementById('infernux-progress');
    const canvasNode = document.getElementById('canvas');
    const assetRevision = '@INFERNUX_WEB_ASSET_REVISION@';
    const playerPresentation = Object.freeze({
      mode: '@INFERNUX_WEB_DISPLAY_MODE@',
      width: Number('@INFERNUX_WEB_CANVAS_WIDTH@'),
      height: Number('@INFERNUX_WEB_CANVAS_HEIGHT@')
    });
    const diagnosticsInTitle = new URLSearchParams(window.location.search).has('diagnostics');
    const versionedAssets = Object.freeze({
      'infernux-player.data': `infernux-player.${assetRevision}.data`,
      'infernux-player.wasm': `infernux-player.${assetRevision}.wasm`
    });
    const diagnostics = [];
    let totalDependencies = 0;
    function setLoadingProgress(value, determinate = true) {
      const percent = Math.max(0, Math.min(100, Number(value) || 0));
      loaderNode.classList.toggle('indeterminate', !determinate);
      progressNode.style.width = determinate ? `${percent}%` : '';
      progressTrackNode.setAttribute('aria-valuenow', String(Math.round(percent)));
    }
    function recordDiagnostic(text) {
      const message = String(text);
      diagnostics.push(message);
      canvasNode.dataset.infernuxDiagnostics = JSON.stringify(diagnostics);
      if (diagnosticsInTitle) document.title = message.slice(0, 160);
    }
    function installTextInputBridge() {
      const input = document.getElementById('infernux-text-input');
      if (!input || input.dataset.infernuxBound === 'true') return;
      input.dataset.infernuxBound = 'true';
      let composing = false;
      let pendingComposition = '';
      let compositionTicket = 0;
      const commit = (value) => {
        const text = String(value || '');
        if (text.length > 0) Module.ccall('InfernuxWebTextInput', null, ['string'], [text]);
        input.value = '';
      };
      input.addEventListener('compositionstart', () => {
        composing = true;
        pendingComposition = '';
        compositionTicket += 1;
      });
      input.addEventListener('compositionend', (event) => {
        composing = false;
        pendingComposition = String(event.data || input.value || '');
        const ticket = ++compositionTicket;
        setTimeout(() => {
          if (ticket !== compositionTicket || !pendingComposition) return;
          commit(pendingComposition);
          pendingComposition = '';
        }, 0);
      });
      input.addEventListener('input', (event) => {
        if (composing || event.isComposing) return;
        compositionTicket += 1;
        const value = input.value || pendingComposition;
        pendingComposition = '';
        commit(value);
      });
      Module.infernuxBeginTextInput = (initialValue = '', inputType = 'text') => {
        const allowedTypes = new Set(['text', 'email', 'url', 'tel', 'search', 'password']);
        input.type = allowedTypes.has(inputType) ? inputType : 'text';
        input.dataset.initialValue = String(initialValue);
        input.value = '';
        input.focus({preventScroll: true});
      };
      Module.infernuxEndTextInput = () => {
        composing = false;
        pendingComposition = '';
        compositionTicket += 1;
        input.blur();
        input.value = '';
      };
      recordDiagnostic('INFERNUX_WEB_TEXT_BRIDGE_READY');
    }
    function focusGameplayCanvas() {
      const textInput = document.getElementById('infernux-text-input');
      if (document.activeElement === textInput) return false;
      try {
        canvasNode.focus({preventScroll: true});
      } catch (_) {
        canvasNode.focus();
      }
      return document.activeElement === canvasNode;
    }
    function installKeyboardFocusBridge() {
      if (canvasNode.dataset.infernuxKeyboardFocusBound === 'true') return;
      canvasNode.dataset.infernuxKeyboardFocusBound = 'true';
      const restore = () => requestAnimationFrame(() => focusGameplayCanvas());
      window.addEventListener('focus', restore);
      window.addEventListener('pageshow', restore);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) restore();
      });
      focusGameplayCanvas();
      recordDiagnostic('INFERNUX_WEB_KEYBOARD_FOCUS_READY');
    }
    function installPointerBridge() {
      if (canvasNode.dataset.infernuxPointerBound === 'true') return;
      canvasNode.dataset.infernuxPointerBound = 'true';
      canvasNode.addEventListener('contextmenu', (event) => event.preventDefault());
      canvasNode.addEventListener('auxclick', (event) => event.preventDefault());
      canvasNode.addEventListener('dragstart', (event) => event.preventDefault());
      const activePointers = new Set();
      const pointerType = (type) => type === 'mouse' ? 0 : (type === 'pen' ? 2 : 1);
      const eventKind = (type) => type === 'pointerdown' ? 0 : (type === 'pointerup' ? 2 : (type === 'pointercancel' ? 3 : 1));
      const forward = (event, forcedKind = null) => {
        const rect = canvasNode.getBoundingClientRect();
        const kind = forcedKind === null ? eventKind(event.type) : forcedKind;
        Module.ccall('InfernuxWebPointerEvent', null,
          ['number','number','number','number','number','number','number','number','number','number','number','number','number'],
          [kind, event.pointerId, pointerType(event.pointerType), event.clientX - rect.left,
           event.clientY - rect.top, event.movementX || 0, event.movementY || 0,
           Number.isFinite(event.pressure) ? event.pressure : 0,
           Number.isFinite(event.width) ? event.width : 0,
           Number.isFinite(event.height) ? event.height : 0,
           event.button, event.buttons, event.isPrimary ? 1 : 0]);
      };
      canvasNode.addEventListener('pointerdown', (event) => {
        activePointers.add(event.pointerId);
        try { canvasNode.setPointerCapture(event.pointerId); } catch (_) { /* synthetic test event */ }
        canvasNode.focus({preventScroll: true});
        forward(event);
        event.preventDefault();
      });
      canvasNode.addEventListener('pointermove', (event) => {
        forward(event);
        event.preventDefault();
      });
      for (const terminal of ['pointerup', 'pointercancel']) {
        canvasNode.addEventListener(terminal, (event) => {
          activePointers.delete(event.pointerId);
          forward(event);
          try {
            if (canvasNode.hasPointerCapture(event.pointerId)) canvasNode.releasePointerCapture(event.pointerId);
          } catch (_) { /* the platform already released this contact */ }
          event.preventDefault();
        });
      }
      canvasNode.addEventListener('lostpointercapture', (event) => {
        if (!activePointers.delete(event.pointerId)) return;
        forward(event, 3);
      });
      recordDiagnostic('INFERNUX_WEB_POINTER_BRIDGE_READY');
    }
    function applyCanvasLayout() {
      const shell = document.getElementById('infernux-shell');
      const viewport = window.visualViewport;
      const viewportLeft = viewport ? viewport.offsetLeft : 0;
      const viewportTop = viewport ? viewport.offsetTop : 0;
      const viewportWidth = Math.max(1, viewport ? viewport.width : window.innerWidth);
      const viewportHeight = Math.max(1, viewport ? viewport.height : window.innerHeight);
      shell.style.inset = 'auto';
      shell.style.position = 'fixed';
      if (playerPresentation.mode === 'windowed') {
        const width = Math.max(1, playerPresentation.width);
        const height = Math.max(1, playerPresentation.height);
        const fit = Math.min(1, viewportWidth / width, viewportHeight / height);
        const cssWidth = Math.max(1, Math.floor(width * fit));
        const cssHeight = Math.max(1, Math.floor(height * fit));
        shell.style.left = `${viewportLeft + Math.floor((viewportWidth - cssWidth) * 0.5)}px`;
        shell.style.top = `${viewportTop + Math.floor((viewportHeight - cssHeight) * 0.5)}px`;
        shell.style.width = `${cssWidth}px`;
        shell.style.height = `${cssHeight}px`;
        document.body.dataset.infernuxPresentation = 'windowed';
      } else {
        shell.style.left = `${viewportLeft}px`;
        shell.style.top = `${viewportTop}px`;
        shell.style.width = `${viewportWidth}px`;
        shell.style.height = `${viewportHeight}px`;
        document.body.dataset.infernuxPresentation = 'fullscreen-borderless';
      }
      canvasNode.style.width = '100%';
      canvasNode.style.height = '100%';
    }
    function installViewportBridge() {
      const safeAreaProbe = document.getElementById('infernux-safe-area-probe');
      const textInput = document.getElementById('infernux-text-input');
      let scheduled = false;
      const update = () => {
        scheduled = false;
        applyCanvasLayout();
        const viewport = window.visualViewport;
        const safe = getComputedStyle(safeAreaProbe);
        const readPixels = (value) => Math.max(0, Number.parseFloat(value) || 0);
        const keyboardKnown = document.activeElement === textInput && Boolean(viewport);
        const keyboardInset = keyboardKnown
          ? Math.max(0, window.innerHeight - viewport.height - viewport.offsetTop)
          : 0;
        Module.ccall('InfernuxWebViewportChanged', null,
          ['number','number','number','number','number','number'],
          [readPixels(safe.paddingLeft), readPixels(safe.paddingTop),
           readPixels(safe.paddingRight), readPixels(safe.paddingBottom),
           keyboardKnown ? 1 : 0, keyboardInset]);
      };
      const schedule = () => {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(update);
      };
      window.addEventListener('resize', schedule, {passive: true});
      window.addEventListener('orientationchange', schedule, {passive: true});
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', schedule, {passive: true});
        window.visualViewport.addEventListener('scroll', schedule, {passive: true});
      }
      textInput.addEventListener('focus', schedule);
      textInput.addEventListener('blur', schedule);
      window.addEventListener('pagehide', () => Module.ccall('InfernuxWebPageLifecycle', null, ['number'], [0]));
      window.addEventListener('pageshow', () => Module.ccall('InfernuxWebPageLifecycle', null, ['number'], [1]));
      document.addEventListener('freeze', () => Module.ccall('InfernuxWebPageLifecycle', null, ['number'], [0]));
      document.addEventListener('resume', () => Module.ccall('InfernuxWebPageLifecycle', null, ['number'], [1]));
      schedule();
      recordDiagnostic('INFERNUX_WEB_VISUAL_VIEWPORT_READY');
    }
    var Module = {
      canvas: canvasNode,
      locateFile(path) {
        return versionedAssets[path] || path;
      },
      postRun: [installTextInputBridge, installPointerBridge, installKeyboardFocusBridge, installViewportBridge],
      setStatus(text) {
        const message = String(text || '').trim();
        if (!message) return;
        statusNode.textContent = message.replace(/\s*\(\d+(?:\.\d+)?\/\d+\)\s*$/, '');
        const progress = message.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
        if (progress) {
          setLoadingProgress(Number(progress[1]) / Math.max(1, Number(progress[2])) * 100);
        } else {
          setLoadingProgress(0, false);
        }
      },
      monitorRunDependencies(left) {
        totalDependencies = Math.max(totalDependencies, left);
        const complete = totalDependencies === 0 ? 0 : (totalDependencies - left) / totalDependencies;
        statusNode.textContent = left > 0 ? 'Loading game content' : 'Starting game';
        loaderHintNode.textContent = left > 0 ? `${Math.round(complete * 100)}%` : 'Finalizing runtime…';
        setLoadingProgress(complete * 100, totalDependencies > 0);
      },
      print(text) {
        recordDiagnostic(text);
        console.log(text);
        if (text.includes('INFERNUX_WEB_HOST_READY')) {
          canvasNode.dataset.infernuxState = 'starting-gameplay';
          statusNode.textContent = 'Starting game';
          loaderHintNode.textContent = 'Publishing the first frame…';
        }
        if (text.includes('INFERNUX_WEB_RUNTIME_ACTIVE')) {
          canvasNode.dataset.infernuxState = 'starting-first-frame';
          statusNode.textContent = 'Starting game';
          loaderHintNode.textContent = 'Rendering the first frame…';
          setLoadingProgress(100);
        }
        if (text.includes('INFERNUX_WEB_FIRST_FRAME_READY')) {
          canvasNode.dataset.infernuxState = 'ready';
          focusGameplayCanvas();
          loaderNode.classList.add('hidden');
          setTimeout(() => loaderNode.remove(), 200);
        }
      },
      printErr(text) {
        recordDiagnostic(`ERROR: ${String(text)}`);
        console.error(text);
      },
      onAbort(reason) {
        canvasNode.dataset.infernuxState = 'aborted';
        loaderNode.classList.remove('hidden', 'indeterminate');
        statusNode.textContent = `Player stopped: ${reason}`;
        loaderHintNode.textContent = 'Open the browser console for details.';
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
