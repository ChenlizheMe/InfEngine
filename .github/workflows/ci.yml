name: Preset Build And Headless Tests

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep manual verification runs from cancelling the required push/PR check.
  # Newer runs of the same event and ref may still replace stale work.
  group: preset-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-headless:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      VULKAN_SDK_VERSION: "1.3.296.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: infernux
          python-version: "3.12"
          auto-activate-base: false

      - name: Cache Vulkan SDK
        id: cache-vulkan
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-windows

      - name: Install Vulkan SDK
        if: steps.cache-vulkan.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          conda activate infernux
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/VulkanSDK-$env:VULKAN_SDK_VERSION-Installer.exe"
          Invoke-WebRequest -Uri $url -OutFile vulkan_sdk.exe
          Start-Process -Wait -FilePath .\vulkan_sdk.exe -ArgumentList `
            "--accept-licenses","--default-answer","--confirm-command","install"

      - name: Install build and test dependencies
        shell: pwsh
        run: |
          conda activate infernux
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Configure native test preset
        shell: pwsh
        run: |
          conda activate infernux
          $env:VULKAN_SDK = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          cmake --preset native-tests

      - name: Build native test preset
        shell: pwsh
        run: |
          conda activate infernux
          $env:VULKAN_SDK = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          cmake --build --preset native-tests

      - name: Provide Vulkan loader for headless tests
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "vulkan-runtime-components.zip"
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "vulkan-runtime"
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkan-runtime-components.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $runtimeRoot -Force
          $runtimeBin = Join-Path $runtimeRoot "VulkanRT-$env:VULKAN_SDK_VERSION-Components\x64"
          if (-not (Test-Path (Join-Path $runtimeBin "vulkan-1.dll"))) {
            throw "Vulkan runtime archive does not contain the expected x64 loader."
          }
          $loader = Join-Path $runtimeBin "vulkan-1.dll"
          $destinations = @("python\Infernux\lib\vulkan-1.dll")
          Get-ChildItem "out\build\native-tests" -Recurse -Filter "InfernuxRuntime.dll" |
            ForEach-Object { $destinations += Join-Path $_.Directory.FullName "vulkan-1.dll" }
          foreach ($destination in ($destinations | Select-Object -Unique)) {
            $parent = Split-Path -Parent $destination
            New-Item -ItemType Directory -Path $parent -Force | Out-Null
            Copy-Item -LiteralPath $loader -Destination $destination -Force
          }

      - name: Run preset tests
        shell: pwsh
        run: |
          conda activate infernux
          $env:VULKAN_SDK = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          ctest --preset native-tests -LE "performance|requires_vulkan_device" --parallel 8 --timeout 120 --output-on-failure
