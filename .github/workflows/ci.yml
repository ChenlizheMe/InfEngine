name: Desktop Release And Tests

on:
  pull_request:
  push:
    branches: [master, main, "040/multiplatform_build"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep manual verification runs from cancelling the required push/PR check.
  # Newer runs of the same event and ref may still replace stale work.
  group: preset-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-desktop:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      VULKAN_SDK_VERSION: "1.3.296.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: infernux
          python-version: "3.13"
          auto-activate-base: false

      - name: Cache Vulkan SDK
        id: cache-vulkan
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-windows

      - name: Install Vulkan SDK
        if: steps.cache-vulkan.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          conda activate infernux
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/VulkanSDK-$env:VULKAN_SDK_VERSION-Installer.exe"
          Invoke-WebRequest -Uri $url -OutFile vulkan_sdk.exe
          Start-Process -Wait -FilePath .\vulkan_sdk.exe -ArgumentList `
            "--accept-licenses","--default-answer","--confirm-command","install"

      - name: Install build and test dependencies
        shell: pwsh
        run: |
          conda activate infernux
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Configure Windows release preset
        shell: pwsh
        run: |
          conda activate infernux
          $env:VULKAN_SDK = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          cmake --preset windows-msvc-release

      - name: Provide Vulkan loader for build and tests
        shell: pwsh
        run: |
          conda activate infernux
          $archive = Join-Path $env:RUNNER_TEMP "vulkan-runtime-components.zip"
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "vulkan-runtime"
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkan-runtime-components.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $runtimeRoot -Force
          $runtimeBin = Join-Path $runtimeRoot "VulkanRT-$env:VULKAN_SDK_VERSION-Components\x64"
          $loader = Join-Path $runtimeBin "vulkan-1.dll"
          if (-not (Test-Path $loader)) {
            throw "Vulkan runtime archive does not contain the expected x64 loader."
          }
          $destinations = @(
            "python\Infernux\lib\vulkan-1.dll",
            "out\build\windows-msvc-release\Release\vulkan-1.dll"
          )
          foreach ($destination in $destinations) {
            $parent = Split-Path -Parent $destination
            New-Item -ItemType Directory -Path $parent -Force | Out-Null
            Copy-Item -LiteralPath $loader -Destination $destination -Force
          }

      - name: Build Windows editor and native tests
        shell: pwsh
        run: |
          conda activate infernux
          $env:VULKAN_SDK = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          cmake --build --preset windows-msvc-release

      - name: Run preset tests
        shell: pwsh
        run: |
          conda activate infernux
          $env:VULKAN_SDK = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          New-Item -ItemType Directory -Path out\test-results -Force | Out-Null
          ctest --preset windows-msvc-release -LE "performance|requires_vulkan_device" --parallel 8 --timeout 120 --output-on-failure --output-junit out\test-results\ctest-windows.xml

      - name: Run Python and platform contract tests
        shell: pwsh
        run: |
          conda activate infernux
          $env:VULKAN_SDK = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          python -m pytest python\test -q --junitxml out\test-results\pytest-windows.xml

      - name: Run Hub tests
        shell: pwsh
        run: |
          conda activate infernux
          $env:PYTHONPATH = 'packaging'
          python -m pytest packaging\tests -q --junitxml out\test-results\pytest-hub-windows.xml

      - name: Build Windows editor wheel and Hub distribution
        shell: pwsh
        run: |
          conda activate infernux
          $env:VULKAN_SDK = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          cmake --build --preset windows-msvc-wheel
          cmake --build --preset windows-hub-installer

      - name: Upload Windows desktop distribution
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/build/windows-msvc-release/python-wheel/*.whl
            out/package/installer/InfernuxHubInstaller.exe
            out/package/hub-release/InfernuxHub-*-windows-x64-full.zip
            out/package/hub-release/InfernuxHub-windows-x64-manifest.json
          if-no-files-found: error

      - name: Upload Windows test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/test-results/*.xml
          if-no-files-found: warn

  linux-desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      SDL_AUDIODRIVER: dummy
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: infernux
          python-version: "3.13"
          auto-activate-base: false

      - name: Install Linux Vulkan build dependencies
        run: scripts/setup/install_linux_dependencies.sh

      - name: Install Python build and test dependencies
        run: |
          conda activate infernux
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Configure Linux release preset
        run: |
          conda activate infernux
          cmake --preset linux-clang-release

      - name: Build Linux editor and native tests
        run: |
          conda activate infernux
          cmake --build --preset linux-clang-release

      - name: Run Linux preset tests
        run: |
          conda activate infernux
          mkdir -p out/test-results
          ctest --preset linux-clang-release -LE "performance|requires_vulkan_device" --parallel 8 --timeout 120 --output-on-failure --output-junit out/test-results/ctest-linux.xml

      - name: Run Python and platform contract tests
        run: |
          conda activate infernux
          xvfb-run --auto-servernum python -m pytest python/test -q --junitxml out/test-results/pytest-linux.xml

      - name: Run Hub tests
        run: |
          conda activate infernux
          PYTHONPATH=packaging python -m pytest packaging/tests -q --junitxml out/test-results/pytest-hub-linux.xml

      - name: Build Linux editor wheel and Hub distribution
        run: |
          conda activate infernux
          cmake --build --preset linux-clang-wheel
          cmake --build --preset linux-hub-installer

      - name: Upload Linux desktop distribution
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/build/linux-clang-release/python-wheel/*.whl
            out/package/installer/InfernuxHubInstaller
            out/package/hub-release/InfernuxHub-*-linux-x64-full.zip
            out/package/hub-release/InfernuxHub-linux-x64-manifest.json
          if-no-files-found: error

      - name: Upload Linux test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/test-results/*.xml
          if-no-files-found: warn
