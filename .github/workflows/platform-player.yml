name: Platform Player Acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/platform-player.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "cpp/**"
      - "external/plugins/infernux_android/**"
      - "external/plugins/infernux_linux/**"
      - "external/plugins/infernux_web/**"
      - "external/plugins/infernux_windows/**"
      - "python/**"
      - "resources/**"
      - "scripts/acceptance/**"
      - "scripts/setup/**"
      - "tests/fixtures/multiplatform_player/**"
  push:
    branches: [master, main]
    paths:
      - ".github/workflows/platform-player.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "cpp/**"
      - "external/plugins/infernux_android/**"
      - "external/plugins/infernux_linux/**"
      - "external/plugins/infernux_web/**"
      - "external/plugins/infernux_windows/**"
      - "python/**"
      - "resources/**"
      - "scripts/acceptance/**"
      - "scripts/setup/**"
      - "tests/fixtures/multiplatform_player/**"
  schedule:
    - cron: "17 18 * * 2,5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-player-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-player:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      VULKAN_SDK_VERSION: "1.3.296.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: infernux
          python-version: "3.13"
          auto-activate-base: false

      - name: Cache Vulkan SDK
        id: cache-windows-vulkan
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-windows

      - name: Install Vulkan SDK
        if: steps.cache-windows-vulkan.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          conda activate infernux
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/VulkanSDK-$env:VULKAN_SDK_VERSION-Installer.exe"
          Invoke-WebRequest -Uri $url -OutFile vulkan_sdk.exe
          Start-Process -Wait -FilePath .\vulkan_sdk.exe -ArgumentList `
            "--accept-licenses","--default-answer","--confirm-command","install"

      - name: Cache Windows native build
        uses: actions/cache@v4
        with:
          path: out\build\windows-msvc-release
          key: windows-player-native-${{ hashFiles('cmake/**', 'CMakeLists.txt', 'cpp/**') }}
          restore-keys: |
            windows-player-native-

      - name: Cache pinned Windows software Vulkan driver
        id: cache-windows-swiftshader
        uses: actions/cache@v4
        with:
          path: out\toolchains\windows-swiftshader
          key: windows-swiftshader-694585a05946e1ed49b6bd577ca6537cbb57f025-runtime-only-v1

      - name: Build pinned Windows software Vulkan driver
        if: steps.cache-windows-swiftshader.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          conda activate infernux
          scripts\setup\build_windows_swiftshader.ps1 out\toolchains\windows-swiftshader

      - name: Install Python dependencies
        shell: pwsh
        run: |
          conda activate infernux
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Provide pinned software Vulkan to the build and Player closure
        shell: pwsh
        run: |
          $softwareVulkan = Resolve-Path "out\toolchains\windows-swiftshader\runtime\vk_swiftshader.dll"
          Copy-Item -LiteralPath $softwareVulkan -Destination "python\Infernux\lib\vulkan-1.dll" -Force
          New-Item -ItemType Directory -Path "out\build\windows-msvc-release\Release" -Force | Out-Null
          Copy-Item -LiteralPath $softwareVulkan -Destination "out\build\windows-msvc-release\Release\vulkan-1.dll" -Force
          $swiftShaderManifest = Resolve-Path "out\toolchains\windows-swiftshader\runtime\vk_swiftshader_icd.json"
          if (-not (Test-Path -LiteralPath $swiftShaderManifest)) {
            throw "The pinned Windows SwiftShader Vulkan ICD is missing."
          }
          "VK_DRIVER_FILES=$swiftShaderManifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VK_ICD_FILENAMES=$swiftShaderManifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate Windows software Vulkan surface support
        shell: pwsh
        run: |
          conda activate infernux
          $env:VK_DRIVER_FILES = "${{ github.workspace }}\out\toolchains\windows-swiftshader\runtime\vk_swiftshader_icd.json"
          $env:VK_ICD_FILENAMES = $env:VK_DRIVER_FILES
          python scripts\acceptance\validate_vulkan_extensions.py `
            --loader python\Infernux\lib\vulkan-1.dll `
            --require VK_KHR_surface `
            --require VK_KHR_win32_surface

      - name: Build Windows Player runtime
        shell: pwsh
        run: |
          conda activate infernux
          $env:VULKAN_SDK = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          cmake --preset windows-msvc-release
          cmake --build --preset windows-msvc-release

      - name: Build Windows Player fixture
        shell: pwsh
        run: |
          conda activate infernux
          $env:VULKAN_SDK = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          New-Item -ItemType Directory -Path out\ci-projects\windows,out\test-results -Force | Out-Null
          Copy-Item tests\fixtures\multiplatform_player\* out\ci-projects\windows -Recurse -Force
          python scripts\acceptance\build_player.py `
            out\ci-projects\windows windows-x64 out\acceptance\windows `
            --report out\test-results\windows-player-build.json

      - name: Validate Windows Player input, physics, and LineRenderer
        shell: pwsh
        run: |
          conda activate infernux
          $probe = '{"object_name":"Platform Fixture Trail","component_type":"LineRenderer","fields":["position_count"],"assertions":[{"field":"position_count","operator":"greater_or_equal","value":3}]}'
          $packageProbe = '{"object_name":"Platform Fixture Package Resource","component_type":"UIText","fields":["text"],"assertions":[{"field":"text","operator":"equal","value":"Package resource reached UIText on every Player target."}]}'
          python scripts\acceptance\windows_player_smoke.py `
            out\acceptance\windows\InfernuxPlatformFixture.exe `
            --report out\test-results\windows-player-smoke.json `
            --artifact-root out\test-results\windows-player-artifacts `
            --object "Render Probe" `
            --axis z `
            --minimum-axis-delta 0.5 `
            --minimum-final-y 0.0 `
            --component-probe $probe `
            --component-probe $packageProbe

      - name: Upload Windows Player evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-player-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/test-results/windows-*
          if-no-files-found: warn

  linux-player:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}
    env:
      SDL_AUDIODRIVER: dummy
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: infernux
          python-version: "3.13"
          auto-activate-base: false

      - name: Cache Linux native build
        uses: actions/cache@v4
        with:
          path: out/build/linux-clang-release
          key: linux-player-${{ runner.os }}-${{ hashFiles('cmake/**', 'CMakeLists.txt', 'cpp/**') }}
          restore-keys: |
            linux-player-${{ runner.os }}-

      - name: Install Linux build and software Vulkan dependencies
        run: |
          scripts/setup/install_linux_dependencies.sh
          sudo apt-get install --yes --no-install-recommends \
            mesa-vulkan-drivers \
            vulkan-validationlayers \
            xvfb
          test -f "$VK_ICD_FILENAMES"

      - name: Install Python dependencies
        run: |
          conda activate infernux
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build Linux Player runtime
        run: |
          conda activate infernux
          cmake --preset linux-clang-release
          cmake --build --preset linux-clang-release

      - name: Build Linux Player fixture
        run: |
          conda activate infernux
          mkdir -p out/ci-projects/linux out/test-results
          cp -a tests/fixtures/multiplatform_player/. out/ci-projects/linux/
          python scripts/acceptance/build_player.py \
            out/ci-projects/linux linux-x64 "out/acceptance/桌面/linux" \
            --report out/test-results/linux-player-build.json

      - name: Validate Linux Player input, physics, and LineRenderer
        run: |
          conda activate infernux
          python scripts/acceptance/linux_player_smoke.py \
            "out/acceptance/桌面/linux/InfernuxPlatformFixture" \
            --report out/test-results/linux-player-smoke.json \
            --artifact-root out/test-results/linux-player-artifacts \
            --xvfb always \
            --vk-driver-files "$VK_ICD_FILENAMES" \
            --validation \
            --object "Render Probe" \
            --axis z \
            --minimum-axis-delta 0.5 \
            --minimum-final-y 0.0 \
            --component-probe '{"object_name":"Platform Fixture Trail","component_type":"LineRenderer","fields":["position_count"],"assertions":[{"field":"position_count","operator":"greater_or_equal","value":3}]}' \
            --component-probe '{"object_name":"Platform Fixture Package Resource","component_type":"UIText","fields":["text"],"assertions":[{"field":"text","operator":"equal","value":"Package resource reached UIText on every Player target."}]}'

      - name: Upload Linux Player evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-player-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/test-results/linux-*
          if-no-files-found: warn

  web-player:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}
    env:
      INFERNUX_SOURCE_ROOT: ${{ github.workspace }}
      INFERNUX_WEB_TOOLCHAIN_ROOT: ${{ github.workspace }}/out/toolchains/web
      INFERNUX_WEB_BUILD_CACHE: ${{ github.workspace }}/out/cache/web
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: infernux
          python-version: "3.13"
          auto-activate-base: false

      - name: Cache Web toolchain and native build
        uses: actions/cache@v4
        with:
          path: |
            out/toolchains/web
            out/cache/web
            out/build/linux-clang-headless
          key: web-player-${{ runner.os }}-${{ hashFiles('scripts/setup/build_web_toolchain.sh', 'cmake/**', 'CMakeLists.txt') }}
          restore-keys: |
            web-player-${{ runner.os }}-

      - name: Install host dependencies
        run: |
          scripts/setup/install_linux_dependencies.sh
          sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers
          test -f "$VK_ICD_FILENAMES"

      - name: Install Python dependencies
        run: |
          conda activate infernux
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build Linux host modules
        run: |
          conda activate infernux
          cmake --preset linux-clang-headless
          cmake --build --preset linux-clang-headless

      - name: Prepare pinned Web toolchain
        run: |
          conda activate infernux
          scripts/setup/build_web_toolchain.sh "$INFERNUX_WEB_TOOLCHAIN_ROOT"
          echo "INFERNUX_EMSDK_ROOT=$INFERNUX_WEB_TOOLCHAIN_ROOT/emsdk" >> "$GITHUB_ENV"
          echo "INFERNUX_WEB_CPYTHON_ROOT=$INFERNUX_WEB_TOOLCHAIN_ROOT/src/Python-3.13.15" >> "$GITHUB_ENV"
          echo "INFERNUX_WEB_TINT=$INFERNUX_WEB_TOOLCHAIN_ROOT/build/dawn-tint-31e25af254ab572c77054edec4946d2244e184dd/tint" >> "$GITHUB_ENV"

      - name: Build Web Player fixture
        run: |
          conda activate infernux
          rm -rf out/ci-projects/web out/acceptance/web
          mkdir -p out/ci-projects/web out/test-results
          cp -a tests/fixtures/multiplatform_player/. out/ci-projects/web/
          python scripts/acceptance/build_player.py \
            out/ci-projects/web web-wasm32 out/acceptance/web \
            --report out/test-results/web-player-build.json \
            --option "build_cache_root=\"$INFERNUX_WEB_BUILD_CACHE\""

      - name: Install browser acceptance runtime
        run: |
          conda activate infernux
          npm ci --prefix scripts/acceptance
          npm exec --prefix scripts/acceptance -- playwright install --with-deps chromium

      - name: Validate Web Player runtime in a Linux mobile browser context
        run: |
          conda activate infernux
          set -o pipefail
          python -m http.server 8765 --bind 127.0.0.1 --directory out/acceptance/web \
            > out/test-results/web-http.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in {1..50}; do
            if curl -fsS -o /dev/null http://127.0.0.1:8765/infernux-player.html; then
              break
            fi
            sleep 0.1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8765/infernux-player.html
          node scripts/acceptance/web_mobile_input_smoke.cjs \
            http://127.0.0.1:8765/infernux-player.html \
            --startup-timeout-ms 360000 \
            --skip-frame-checks \
            --verify-native-multitouch \
            --require-diagnostic "INFERNUX_PLATFORM_FIXTURE_PACKAGE_RESOURCE_READY value=Package resource reached UIText on every Player target." \
            --require-diagnostic "INFERNUX_PLATFORM_FIXTURE_PRELOAD_RESOURCE_READY value=Package resource reached UIText on every Player target." \
            | tee out/test-results/web-player-smoke.json

      - name: Upload Web Player for visual acceptance
        uses: actions/upload-artifact@v4
        with:
          name: web-player-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/acceptance/web
          if-no-files-found: error
          retention-days: 1

      - name: Upload Web Player evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-player-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/test-results/web-*
            out/toolchains/web/infernux-web-toolchain.json
          if-no-files-found: warn

  web-browser:
    needs: web-player
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download Linux-built Web Player
        uses: actions/download-artifact@v4
        with:
          name: web-player-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/acceptance/web

      - name: Install browser acceptance runtime
        shell: pwsh
        run: npm ci --prefix scripts/acceptance

      - name: Validate Web Player pixels and input in Edge
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out/test-results -Force | Out-Null
          $server = Start-Process -FilePath python `
            -ArgumentList @("-m", "http.server", "8765", "--bind", "127.0.0.1", "--directory", "out/acceptance/web") `
            -WindowStyle Hidden `
            -RedirectStandardOutput out/test-results/web-edge-http.stdout.log `
            -RedirectStandardError out/test-results/web-edge-http.stderr.log `
            -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 50; $attempt++) {
              try {
                Invoke-WebRequest http://127.0.0.1:8765/infernux-player.html -UseBasicParsing | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 100
              }
            }
            if (-not $ready) {
              throw "Web Player HTTP server did not become ready"
            }
            node scripts/acceptance/web_mobile_input_smoke.cjs `
              http://127.0.0.1:8765/infernux-player.html `
              --startup-timeout-ms 360000 `
              --verify-native-multitouch `
              --require-diagnostic "INFERNUX_PLATFORM_FIXTURE_PACKAGE_RESOURCE_READY value=Package resource reached UIText on every Player target." `
              --require-diagnostic "INFERNUX_PLATFORM_FIXTURE_PRELOAD_RESOURCE_READY value=Package resource reached UIText on every Player target." `
              --report out/test-results/web-edge-player-smoke.json
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Web browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/test-results/web-edge-*
          if-no-files-found: warn

  android-player:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}
    env:
      INFERNUX_SOURCE_ROOT: ${{ github.workspace }}
      INFERNUX_ANDROID_RUNTIME: ${{ github.workspace }}/out/toolchains/android-python-x86_64
      INFERNUX_ANDROID_RUNTIME_WORK: ${{ github.workspace }}/out/cache/android-python
      INFERNUX_ANDROID_BUILD_CACHE: ${{ github.workspace }}/out/cache/android-player
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: infernux
          python-version: "3.13"
          auto-activate-base: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK
        run: |
          conda activate infernux
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.30.5" \
            "ndk;27.3.13750724" \
            "ndk;29.0.14206865"

      - name: Cache Android Python runtime and build intermediates
        uses: actions/cache@v4
        with:
          path: |
            out/toolchains/android-python-x86_64
            out/cache/android-python
            out/cache/android-player
            out/build/linux-clang-headless
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-player-${{ runner.os }}-${{ hashFiles('scripts/setup/build_android_python_runtime.sh', 'scripts/setup/android_python_runtime.py', 'scripts/setup/android_numpy_cross.ini', 'external/plugins/infernux_android/**', 'cmake/**', 'CMakeLists.txt', 'cpp/**') }}
          restore-keys: |
            android-player-${{ runner.os }}-

      - name: Install Linux host dependencies
        run: scripts/setup/install_linux_dependencies.sh

      - name: Install Python dependencies
        run: |
          conda activate infernux
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build Linux host modules
        run: |
          conda activate infernux
          cmake --preset linux-clang-headless
          cmake --build --preset linux-clang-headless

      - name: Prepare pinned Android Python runtime
        run: |
          conda activate infernux
          if [[ -d "$INFERNUX_ANDROID_RUNTIME" ]]; then
            python scripts/setup/android_python_runtime.py verify \
              "$INFERNUX_ANDROID_RUNTIME" \
              --abi x86_64 \
              --application-minimum-api 26
          else
            scripts/setup/build_android_python_runtime.sh \
              x86_64 \
              "$INFERNUX_ANDROID_RUNTIME" \
              "$INFERNUX_ANDROID_RUNTIME_WORK"
          fi

      - name: Build and validate Android Player on API 36
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: |
            bash scripts/acceptance/android_emulator_ci.sh "$CONDA/envs/infernux/bin/python"

      - name: Upload Android Player evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-player-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/test-results/android-*
          if-no-files-found: warn
